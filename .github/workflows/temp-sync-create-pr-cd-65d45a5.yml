name: Temporary create-pr-cd 65d45a5 Sync

on:
  push:
    branches:
      - chore/sync-create-pr-cd-65d45a5
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'ci: prepare create-pr-cd 65d45a5 compatibility sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/sync-create-pr-cd-65d45a5
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/create-pr-cd/requirements.txt

      - name: Update submodule and platform audit metadata
        shell: bash
        run: |
          set -euo pipefail
          git -C skills/create-pr-cd fetch origin 65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf
          git -C skills/create-pr-cd checkout --detach 65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf

          python - <<'PY'
          from pathlib import Path

          old_version = 'approved-708fb92'
          new_version = 'approved-65d45a5'
          old_commit = '708fb9268c8d8d9ce213c1cb3e837090e9195251'
          new_commit = '65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf'

          replacements = {
              Path('README.md'): [(old_version, new_version), (old_commit, new_commit)],
              Path('backend/scripts/job-service-worker-payload-test.js'): [(old_version, new_version), (old_commit, new_commit)],
              Path('backend/src/workers/manifests/mwPrManifest.js'): [(old_version, new_version), (old_commit, new_commit)],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{old!r} not found in {path}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')

          manifest = Path('backend/src/workers/manifests/mwPrManifest.js')
          text = manifest.read_text(encoding='utf-8')
          anchor = "    'scripts/jendela_migration_decision.py',\n"
          addition = "    'scripts/mw_hardware_upgrade_selector.py',\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('runtimeFiles insertion anchor not found')
              text = text.replace(anchor, anchor + addition)
          manifest.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Install platform and engine dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          python -m pip install -r skills/create-pr-cd/requirements.txt

      - name: Compute and approve runtime fingerprint
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(node - <<'NODE'
          const path = require('path');
          const manifest = require('./backend/src/workers/manifests/mwPrManifest');
          const { computeRuntimeFingerprint } = require('./backend/src/services/engineIntegrityService');
          process.stdout.write(computeRuntimeFingerprint(path.resolve('skills/create-pr-cd'), manifest.runtimeFiles));
          NODE
          )"
          echo "RUNTIME_FINGERPRINT=${FINGERPRINT}"
          python - "$FINGERPRINT" <<'PY'
          from pathlib import Path
          import re
          import sys

          fingerprint = sys.argv[1]
          if not re.fullmatch(r'[a-f0-9]{64}', fingerprint):
              raise SystemExit(f'Invalid fingerprint: {fingerprint!r}')
          path = Path('backend/src/workers/manifests/mwPrManifest.js')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"runtimeFingerprint: '[a-f0-9]{64}'",
              f"runtimeFingerprint: '{fingerprint}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected exactly one runtime fingerprint field')
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY

      - name: Run upstream Issue 69 compatibility regression
        working-directory: skills/create-pr-cd
        run: |
          python -m unittest \
            tests.test_mw_hardware_upgrade_selection \
            tests.test_mw_hardware_upgrade_selector_boundaries \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_geography_resolver \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_tx_mini_golden_parity \
            tests.test_tx_mini_negative_acceptance \
            tests.test_tx_mini_tss_ecc_parity

      - name: Run platform backend compatibility suite
        run: npm test --prefix backend

      - name: Run platform frontend regression suite
        run: npm test --prefix frontend

      - name: Verify submodule and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C skills/create-pr-cd rev-parse HEAD)" = "65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf"
          git diff --check
          git status --short

      - name: Commit verified sync and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-sync-create-pr-cd-65d45a5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md backend/scripts/job-service-worker-payload-test.js backend/src/workers/manifests/mwPrManifest.js skills/create-pr-cd .github/workflows/temp-sync-create-pr-cd-65d45a5.yml
          git diff --cached --check
          git commit -m 'chore(submodule): sync create-pr-cd issue 69 fix'
          git push origin HEAD:chore/sync-create-pr-cd-65d45a5
