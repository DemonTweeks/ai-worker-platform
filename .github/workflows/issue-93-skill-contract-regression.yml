name: Issue 93 Skill Contract Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "skills/create-pr-cd"
      - "backend/src/skills/approvedSkills.json"
      - "backend/src/skills/**"
      - "backend/scripts/generic-skill-live-test.js"
      - ".github/workflows/issue-93-skill-contract-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout platform and skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/create-pr-cd/requirements.txt
      - name: Install create-pr-cd dependencies
        run: python -m pip install -r skills/create-pr-cd/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify create-pr-cd package approval
        working-directory: backend
        run: node -e "require('./src/skills/skillPackageService').loadApprovedSkill('create-pr-cd'); console.log('create-pr-cd package approval verified')"
      - name: Verify Issue 93 live fail-closed persistence
        working-directory: backend
        run: npm run test:skill-live
      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
