name: Issue 80 Final Gate

on:
  push:
    branches:
      - fix/issue-80-active-jobs-density

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run focused layout contract
        run: npm run test:unit -- src/__tests__/responsiveWorkbenchCss.spec.js

      - name: Build frontend
        run: npm run build

      - name: Run bounded route smoke
        shell: bash
        run: |
          set +e
          timeout 60s npm run smoke 2>&1 | tee route-smoke.log
          smoke_status=${PIPESTATUS[0]}
          set -e
          grep -q '"ok":true' route-smoke.log
          if [ "$smoke_status" -ne 0 ] && [ "$smoke_status" -ne 124 ]; then
            exit "$smoke_status"
          fi
