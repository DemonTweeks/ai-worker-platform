name: Temporary Issue 78 TDD

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  verify-and-fix-issue-78:
    if: >-
      github.event.pull_request.head.ref == 'fix/issue-78-partial-ran-retention-warning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify RED, apply minimal fix, verify GREEN
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/issue-78-partial-ran-retention-warning
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm ci --prefix frontend

          if grep -Fq "stored.bomPrevalidatedFileId && !this.ranBomPrevalidation" frontend/src/views/PRCreatorView.vue; then
            echo "Production fix already applied; verifying the final branch."
            npm --prefix frontend test
            exit 0
          fi

          set +e
          npm --prefix frontend run test:unit -- src/views/__tests__/PRCreatorRanRetention.spec.js > /tmp/issue78-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/issue78-red.log

          if [ "$red_status" -eq 0 ]; then
            echo "Expected the new regression test to fail before the production fix."
            exit 1
          fi

          if ! grep -Eq "restores (BOM-only|EPMS-only) state without a false missing-upload warning" /tmp/issue78-red.log; then
            echo "The RED failure did not come from the intended partial-retention behavior."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/views/PRCreatorView.vue')
          content = path.read_text(encoding='utf-8')
          old = """      if (!this.ranBomPrevalidation || !this.ranEpmsPrevalidation) {
                this.commandNotice = 'One or more previously validated RAN uploads are no longer available. Please select the missing workbook again.';
              }
          """
          new = """      if (
                (stored.bomPrevalidatedFileId && !this.ranBomPrevalidation)
                || (stored.epmsPrevalidatedFileId && !this.ranEpmsPrevalidation)
              ) {
                this.commandNotice = 'One or more previously validated RAN uploads are no longer available. Please select the missing workbook again.';
              }
          """

          if content.count(old) != 1:
              raise SystemExit(f'Expected exactly one issue #78 target block, found {content.count(old)}')

          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

          npm --prefix frontend run test:unit -- src/views/__tests__/PRCreatorRanRetention.spec.js
          npm --prefix frontend test

          git add frontend/src/views/PRCreatorView.vue
          git commit -m "fix(ran-pr): warn only for retained uploads that fail restoration"
          git push origin HEAD:fix/issue-78-partial-ran-retention-warning
