name: Temporary PR 40 Integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  integrate-pr40:
    if: >-
      github.event.pull_request.head.ref == 'integration/pr-40-resolution' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/pr-40-resolution
          fetch-depth: 0

      - name: Merge current main and apply reviewed responsive implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout --theirs -- "$file"
              git add "$file"
            done < <(git diff --name-only --diff-filter=U)
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved files remain:\n%s\n' "$unresolved"
            exit 1
          fi

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Integration branch already contains current main."
            exit 0
          fi

          git checkout origin/main -- \
            frontend/src/styles.css \
            frontend/src/views/PRAuditorView.vue \
            frontend/src/views/PRCreatorView.vue \
            frontend/src/views/__tests__/PRCreatorView.spec.js \
            frontend/src/views/shared/workerRuntime.js

          cat >> frontend/src/styles.css <<'CSS'

/* Issue #26: keep Active Jobs and Result Delivery inside the workbench viewport. */
.workbench-result-card {
  grid-template-columns: minmax(0, 1fr);
  min-width: 0;
  overflow: hidden;
}

.workbench-result-card > .cockpit-card-heading {
  align-items: center;
  flex-direction: row;
  justify-content: space-between;
  min-width: 0;
}

.workbench-result-card > .download-compact {
  min-width: 0;
  overflow-x: auto;
  width: 100%;
}

.workbench-result-card .active-jobs-table {
  min-width: 720px;
  table-layout: fixed;
  width: 100%;
}

.workbench-result-card .active-jobs-table th,
.workbench-result-card .active-jobs-table td {
  overflow-wrap: anywhere;
  vertical-align: top;
  white-space: normal;
}

.workbench-result-card .active-jobs-table th:nth-child(1),
.workbench-result-card .active-jobs-table td:nth-child(1) {
  width: 18%;
}

.workbench-result-card .active-jobs-table th:nth-child(2),
.workbench-result-card .active-jobs-table td:nth-child(2) {
  width: 16%;
}

.workbench-result-card .active-jobs-table th:nth-child(3),
.workbench-result-card .active-jobs-table td:nth-child(3) {
  width: 13%;
}

.workbench-result-card .active-jobs-table th:nth-child(4),
.workbench-result-card .active-jobs-table td:nth-child(4) {
  width: 23%;
}

.workbench-result-card .active-jobs-table th:nth-child(5),
.workbench-result-card .active-jobs-table td:nth-child(5) {
  width: 14%;
}

.workbench-result-card .active-jobs-table th:nth-child(6),
.workbench-result-card .active-jobs-table td:nth-child(6) {
  width: 16%;
}

.workbench-result-card .active-jobs-table .secondary-link {
  line-height: 1.2;
  max-width: 100%;
  min-width: 0;
  padding: 7px 6px;
  white-space: normal;
  width: 100%;
}

@media (max-width: 760px) {
  .workbench-result-card .active-jobs-table {
    min-width: 640px;
  }

  .workbench-result-card .active-jobs-table th,
  .workbench-result-card .active-jobs-table td {
    font-size: 11px;
    padding: 7px 6px;
  }
}
CSS

          rm -f .github/pr40-integration-trigger.txt
          git add -A

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused PR Creator tests
        run: npm --prefix frontend run test:unit -- src/views/__tests__/PRCreatorView.spec.js

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit and push resolved integration
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge current main and apply responsive workbench containment"
          git push origin HEAD:integration/pr-40-resolution
