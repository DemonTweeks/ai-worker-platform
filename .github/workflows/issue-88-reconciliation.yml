name: Issue 88 Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/services/zeroOutputPolicyService.js'
      - 'backend/src/services/resultReconciliationService.js'
      - 'backend/src/models/Job.js'
      - 'backend/src/services/summaryBuilder.js'
      - 'backend/src/services/finalSummaryService.js'
      - 'backend/scripts/result-reconciliation-test.js'
      - 'backend/package.json'
      - '.github/workflows/issue-88-reconciliation.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:result-reconciliation
