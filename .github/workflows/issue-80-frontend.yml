name: Issue 80 Frontend Gate

on:
  push:
    branches:
      - fix/issue-80-active-jobs-density
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/issue-80-frontend.yml'

permissions:
  contents: read

jobs:
  issue-80:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR result
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Issue 80 focused contract
        run: npm run test:unit -- src/__tests__/responsiveWorkbenchCss.spec.js

      - name: Build frontend
        run: npm run build

      - name: Run bounded route smoke
        shell: bash
        run: |
          set +e
          timeout 60s npm run smoke 2>&1 | tee route-smoke.log
          smoke_status=${PIPESTATUS[0]}
          set -e
          grep -q '"ok":true' route-smoke.log
          if [ "$smoke_status" -ne 0 ] && [ "$smoke_status" -ne 124 ]; then
            exit "$smoke_status"
          fi

  branch-unit-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR result
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Observe full branch unit suite
        continue-on-error: true
        env:
          NO_COLOR: '1'
        run: npm run test:unit

  main-unit-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Observe current main unit baseline
        continue-on-error: true
        env:
          NO_COLOR: '1'
        run: npm run test:unit
