name: Issue 80 Frontend Gate

on:
  push:
    branches:
      - fix/issue-80-active-jobs-density
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/issue-80-frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Issue 80 focused contract
        run: npm run test:unit -- src/__tests__/responsiveWorkbenchCss.spec.js

      - name: Run full frontend verification
        run: npm test
