name: Issue 84 Rebuild Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Targeted App navigation and sticky-header tests
        working-directory: frontend
        timeout-minutes: 2
        run: npx vitest run src/__tests__/App.spec.js --reporter=verbose

      - name: Targeted Dashboard layout tests
        working-directory: frontend
        timeout-minutes: 2
        run: npx vitest run src/views/__tests__/DashboardView.spec.js --reporter=verbose

      - name: Frontend unit suite
        working-directory: frontend
        timeout-minutes: 4
        run: npm run test:unit

      - name: Frontend production build
        working-directory: frontend
        timeout-minutes: 2
        run: npm run build

      - name: Route smoke
        working-directory: frontend
        timeout-minutes: 2
        run: npm run smoke

      - name: Compatibility assertions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          grep -q "Status" frontend/src/App.vue
          grep -q "selectedJobId" frontend/src/App.vue
          grep -q "awp:selected-job-changed" frontend/src/App.vue
          grep -q "resultStatus" frontend/src/views/PRCreatorView.vue
          grep -q "overflow-x: hidden" frontend/src/views/DashboardView.vue
          ! grep -q "overflow-x: auto" frontend/src/views/DashboardView.vue
          ! grep -q "min-width: 640px" frontend/src/views/DashboardView.vue
