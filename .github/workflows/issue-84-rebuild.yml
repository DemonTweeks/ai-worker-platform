name: Issue 84 Rebuild Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend full gate
        working-directory: frontend
        run: npm test

      - name: Compatibility assertions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          grep -q "Status" frontend/src/App.vue
          grep -q "selectedJobId" frontend/src/App.vue
          grep -q "awp:selected-job-changed" frontend/src/App.vue
          grep -q "resultStatus" frontend/src/views/PRCreatorView.vue
          grep -q "overflow-x: hidden" frontend/src/views/DashboardView.vue
          ! grep -q "overflow-x: auto" frontend/src/views/DashboardView.vue
          ! grep -q "min-width: 640px" frontend/src/views/DashboardView.vue
