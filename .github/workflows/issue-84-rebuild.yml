name: Issue 84 Rebuild Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Targeted App navigation and sticky-header tests
        working-directory: frontend
        timeout-minutes: 2
        run: npx vitest run src/__tests__/App.spec.js --reporter=verbose

      - name: Targeted Dashboard layout tests
        working-directory: frontend
        timeout-minutes: 2
        run: npx vitest run src/views/__tests__/DashboardView.spec.js --reporter=verbose

      - name: Frontend unit suite
        working-directory: frontend
        timeout-minutes: 4
        run: npm run test:unit

      - name: Frontend production build
        working-directory: frontend
        timeout-minutes: 2
        run: npm run build

      - name: Route smoke
        working-directory: frontend
        timeout-minutes: 2
        run: npm run smoke

      - name: Compatibility assertions
        shell: pwsh
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          $App = Get-Content 'frontend/src/App.vue' -Raw
          $JobStatus = Get-Content 'frontend/src/utils/jobStatusUtils.js' -Raw
          $Runtime = Get-Content 'frontend/src/views/shared/workerRuntime.js' -Raw
          $Dashboard = Get-Content 'frontend/src/views/DashboardView.vue' -Raw
          if ($App -notmatch 'Status') { throw 'Global Status navigation missing.' }
          if ($App -notmatch 'selectedJobId') { throw 'Selected-job navigation plumbing missing.' }
          if ($App -notmatch 'awp:selected-job-changed') { throw 'Selected-job event plumbing missing.' }
          if ($JobStatus -notmatch 'resultStatus') { throw 'Issue #88 result-status mapping missing.' }
          if ($Runtime -notmatch 'isIncompleteResult') { throw 'Issue #88 runtime reconciliation presentation missing.' }
          if ($Dashboard -notmatch 'overflow-x: hidden') { throw 'Active Jobs no-scroll guard missing.' }
          if ($Dashboard -match 'overflow-x: auto') { throw 'Active Jobs horizontal scrolling regression detected.' }
          if ($Dashboard -match 'min-width: 640px') { throw 'Active Jobs forced-width scrolling regression detected.' }
