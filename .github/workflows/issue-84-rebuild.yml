name: Issue 84 Rebuild

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-84-dashboard-ui-polish-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Replay PR 87 and preserve global Status navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main refs/pull/87/head:refs/remotes/origin/pr87
          git cherry-pick 5158f3b6920186e83a9bf0e18aa86d4dad738f6e
          git checkout HEAD^ -- frontend/src/App.vue frontend/src/__tests__/App.spec.js frontend/src/__tests__/AppNavigation.spec.js

          node <<'NODE'
          const fs = require('fs');
          const appPath = 'frontend/src/App.vue';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace('<header class="app-header">', `<header\n      class="app-header"\n      :class="{ 'is-hidden': isHeaderHidden }"\n      @focusin="showHeader"\n    >`);
          app = app.replace("      storedSelectedJobId: ''\n", "      storedSelectedJobId: '',\n      isHeaderHidden: false,\n      lastScrollY: 0,\n      headerScrollFrame: null\n");
          app = app.replace(`    this.checkHealth();\n    this.healthTimer = setInterval(this.checkHealth, 30000);`, `    this.checkHealth();\n    this.healthTimer = setInterval(this.checkHealth, 30000);\n    if (typeof window !== 'undefined') {\n      this.lastScrollY = Math.max(window.scrollY || 0, 0);\n      window.addEventListener('scroll', this.handleHeaderScroll, { passive: true });\n    }`);
          app = app.replace(`    if (typeof window !== 'undefined') {\n      window.removeEventListener(SELECTED_JOB_CHANGED_EVENT, this.handleSelectedJobChanged);\n    }\n    if (this.healthTimer) {`, `    if (typeof window !== 'undefined') {\n      window.removeEventListener(SELECTED_JOB_CHANGED_EVENT, this.handleSelectedJobChanged);\n      window.removeEventListener('scroll', this.handleHeaderScroll);\n      if (this.headerScrollFrame !== null) {\n        if (typeof window.cancelAnimationFrame === 'function') window.cancelAnimationFrame(this.headerScrollFrame);\n        else window.clearTimeout(this.headerScrollFrame);\n      }\n    }\n    if (this.healthTimer) {`);
          const anchor = `    handleSelectedJobChanged(event) {\n      const nextJobId = event && event.detail && typeof event.detail.jobId === 'string'\n        ? event.detail.jobId\n        : '';\n      this.storedSelectedJobId = nextJobId;\n    },\n`;
          const methods = `${anchor}    handleHeaderScroll() {\n      if (this.headerScrollFrame !== null || typeof window === 'undefined') return;\n      const requestFrame = typeof window.requestAnimationFrame === 'function'\n        ? window.requestAnimationFrame.bind(window)\n        : (callback) => window.setTimeout(callback, 16);\n      this.headerScrollFrame = requestFrame(() => {\n        const currentScrollY = Math.max(window.scrollY || 0, 0);\n        const scrollDelta = currentScrollY - this.lastScrollY;\n        if (currentScrollY <= 16) {\n          this.isHeaderHidden = false;\n          this.lastScrollY = currentScrollY;\n        } else if (Math.abs(scrollDelta) >= 6) {\n          this.isHeaderHidden = scrollDelta > 0 && currentScrollY > 80;\n          this.lastScrollY = currentScrollY;\n        }\n        this.headerScrollFrame = null;\n      });\n    },\n    showHeader() {\n      this.isHeaderHidden = false;\n    },\n`;
          if (!app.includes(anchor)) throw new Error('App method anchor not found');
          fs.writeFileSync(appPath, app.replace(anchor, methods));

          const testPath = 'frontend/src/__tests__/App.spec.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const closing = '\n});\n';
          const idx = test.lastIndexOf(closing);
          if (idx < 0) throw new Error('App.spec closing anchor not found');
          const stickyTest = `\n  it('hides on downward scroll and reappears on upward scroll', async () => {\n    vi.useFakeTimers();\n    Object.defineProperty(window, 'scrollY', { configurable: true, value: 0, writable: true });\n    const wrapper = mountApp();\n    window.scrollY = 120;\n    wrapper.vm.handleHeaderScroll();\n    vi.advanceTimersByTime(16);\n    await wrapper.vm.$nextTick();\n    expect(wrapper.find('.app-header').classes()).toContain('is-hidden');\n    window.scrollY = 80;\n    wrapper.vm.handleHeaderScroll();\n    vi.advanceTimersByTime(16);\n    await wrapper.vm.$nextTick();\n    expect(wrapper.find('.app-header').classes()).not.toContain('is-hidden');\n    wrapper.destroy();\n    vi.useRealTimers();\n  });\n`;
          fs.writeFileSync(testPath, test.slice(0, idx) + stickyTest + test.slice(idx));
          NODE

          git add frontend
          git commit -m "fix(frontend): preserve global Status with dashboard polish [rebuild-complete]"
          git push origin HEAD:fix/issue-84-dashboard-ui-polish-main

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend full gate
        working-directory: frontend
        run: npm test

      - name: Whitespace and scope checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -q "Status" frontend/src/App.vue
          grep -q "selectedJobId" frontend/src/App.vue
          grep -q "resultStatus" frontend/src/views/PRCreatorView.vue
