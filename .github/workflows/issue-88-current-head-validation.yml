name: Issue 88 Current Head Validation

on:
  push:
    branches:
      - fix/issue-88-result-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Issue 88 reconciliation gate
        working-directory: backend
        run: npm run test:result-reconciliation

      - name: Safe error visibility
        working-directory: backend
        run: node scripts/error-visibility-test.js

      - name: Job API payload
        working-directory: backend
        run: npm run test:job-service-workers

      - name: Cancellation and concurrency
        working-directory: backend
        run: npm run test:job-control-concurrency

      - name: Repository-contained backend compatibility gate
        working-directory: backend
        shell: pwsh
        run: |
          npm run smoke
          npm run test:llm-provider
          npm run test:health-status
          npm run test:preflight
          npm run test:engine-header-hash
          npm run test:ran-adapter
          npm run test:ran-worker-service
          npm run test:queue-registry
          npm run test:job-prevalidate-guard
          node scripts/pr-auditor-adapter-test.js
          node scripts/pr-auditor-output-ingestion-test.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend full gate
        working-directory: frontend
        run: npm test

      - name: Diff whitespace check
        shell: pwsh
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
