name: Temporary Issue 78 Branch Verification

on:
  push:
    branches:
      - fix/issue-78-partial-ran-retention-warning

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run focused and full frontend verification
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/issue-78-partial-ran-retention-warning
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm ci --prefix frontend
          npm --prefix frontend run test:unit -- src/views/__tests__/PRCreatorRanRetention.spec.js
          npm --prefix frontend test

          rm .github/workflows/temporary-issue-78-branch-verification.yml
          git add -A
          git commit -m "test(ran-pr): verify issue 78 frontend regression"
          git push origin HEAD:fix/issue-78-partial-ran-retention-warning
