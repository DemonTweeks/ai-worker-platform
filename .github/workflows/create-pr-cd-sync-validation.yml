name: create-pr-cd sync validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout candidate branch with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Detect whether compatibility pin still needs generation
        id: sync-state
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "engineCommit: '3954cc0899c01eef0f34042599584dab1e8f6063'" backend/src/workers/manifests/mwPrManifest.js; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Compatibility pin already generated; no-op validation rerun."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: steps.sync-state.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        if: steps.sync-state.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify submodule target
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C skills/create-pr-cd rev-parse HEAD)" = "3954cc0899c01eef0f34042599584dab1e8f6063"
          git submodule status skills/create-pr-cd

      - name: Install validation dependencies
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-worker.txt
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Generate exact platform compatibility pin
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_short = '7971f90'
          old_commit = '7971f90fadb205316f1ffab1dfc810916beb6fbd'
          old_fingerprint = 'aebece62a04936025fde89aa80abf9b1586b272d54df8879c5e619df03483d51'
          new_short = '3954cc0'
          new_commit = '3954cc0899c01eef0f34042599584dab1e8f6063'
          placeholder = '0' * 64

          manifest_path = Path('backend/src/workers/manifests/mwPrManifest.js')
          manifest = manifest_path.read_text(encoding='utf-8')
          required = [
              f"engineVersion: 'approved-{old_short}'",
              f"engineCommit: '{old_commit}'",
              f"runtimeFingerprint: '{old_fingerprint}'",
          ]
          for token in required:
              if token not in manifest:
                  raise SystemExit(f'manifest token missing: {token}')
          manifest = manifest.replace(f"engineVersion: 'approved-{old_short}'", f"engineVersion: 'approved-{new_short}'", 1)
          manifest = manifest.replace(f"engineCommit: '{old_commit}'", f"engineCommit: '{new_commit}'", 1)
          manifest = manifest.replace(f"runtimeFingerprint: '{old_fingerprint}'", f"runtimeFingerprint: '{placeholder}'", 1)

          insertions = [
              ("    'config/registries/canonical_sow_registry.yaml',\n", "    'config/pr_model_baseline.yaml',\n"),
              ("    'scripts/create_pr.py',\n", "    'scripts/pr_model_baseline.py',\n    'scripts/renderer_reconciliation.py',\n"),
          ]
          for anchor, addition in insertions:
              if addition.strip() not in manifest:
                  if anchor not in manifest:
                      raise SystemExit(f'manifest insertion anchor missing: {anchor!r}')
                  manifest = manifest.replace(anchor, addition + anchor, 1)
          manifest_path.write_text(manifest, encoding='utf-8')

          for file_name in ('backend/scripts/job-service-worker-payload-test.js', 'README.md'):
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              if old_commit not in text or f'approved-{old_short}' not in text:
                  raise SystemExit(f'old pin missing from {file_name}')
              text = text.replace(f'approved-{old_short}', f'approved-{new_short}')
              text = text.replace(old_commit, new_commit)
              path.write_text(text, encoding='utf-8')
          PY

          FINGERPRINT="$(node - <<'NODE'
          const path = require('path');
          const manifest = require('./backend/src/workers/manifests/mwPrManifest');
          const { computeRuntimeFingerprint } = require('./backend/src/services/engineIntegrityService');
          process.stdout.write(computeRuntimeFingerprint(path.resolve('skills/create-pr-cd'), manifest.runtimeFiles));
          NODE
          )"
          echo "Computed MW runtime fingerprint: ${FINGERPRINT}"
          export FINGERPRINT
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('backend/src/workers/manifests/mwPrManifest.js')
          text = path.read_text(encoding='utf-8')
          placeholder = "runtimeFingerprint: '" + ('0' * 64) + "'"
          replacement = "runtimeFingerprint: '" + os.environ['FINGERPRINT'] + "'"
          if placeholder not in text:
              raise SystemExit('fingerprint placeholder missing')
          path.write_text(text.replace(placeholder, replacement, 1), encoding='utf-8')
          PY

      - name: Verify new upstream delta tests
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        working-directory: skills/create-pr-cd
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_issue_74_reconciliation \
            tests.test_pr_model_baseline \
            tests.test_create_pr_entrypoint \
            tests.test_create_pr_safety_integration

      - name: Verify platform engine integrity and worker metadata
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node backend/scripts/engine-integrity-test.js
          node backend/scripts/job-service-worker-payload-test.js
          npm --prefix backend run test:result-reconciliation

      - name: Compare known integration fixture failure against current main
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm --prefix backend run test:integration > /tmp/candidate-integration.log 2>&1
          candidate_exit=$?
          set -e
          cat /tmp/candidate-integration.log

          if [ "$candidate_exit" -eq 0 ]; then
            echo "Candidate integration suite passed; A/B baseline comparison is unnecessary."
            exit 0
          fi

          grep -q 'SITE_CODES_NOT_FOUND' /tmp/candidate-integration.log
          grep -q 'QA15_UNMATCHED' /tmp/candidate-integration.log

          baseline_root="/tmp/ai-worker-platform-main-baseline"
          git worktree add --detach "$baseline_root" origin/main
          git -C "$baseline_root" submodule update --init --recursive
          npm ci --prefix "$baseline_root/backend"

          set +e
          npm --prefix "$baseline_root/backend" run test:integration > /tmp/baseline-integration.log 2>&1
          baseline_exit=$?
          set -e
          cat /tmp/baseline-integration.log

          if [ "$baseline_exit" -eq 0 ]; then
            echo "Current main integration passes while candidate fails; treating as regression."
            exit 1
          fi

          grep -q 'SITE_CODES_NOT_FOUND' /tmp/baseline-integration.log
          grep -q 'QA15_UNMATCHED' /tmp/baseline-integration.log
          echo "A/B confirmed identical known QA15_UNMATCHED fail-closed fixture behavior on current main and candidate."

      - name: Verify frontend regression surface
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run test:unit
          npm --prefix frontend run build

      - name: Verify diff and commit generated sync
        if: steps.sync-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- README.md backend/src/workers/manifests/mwPrManifest.js backend/scripts/job-service-worker-payload-test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md backend/src/workers/manifests/mwPrManifest.js backend/scripts/job-service-worker-payload-test.js
          git diff --cached --check
          git commit -m "chore(submodule): sync create-pr-cd to 3954cc0 [sync-generated]"
          git push origin HEAD:chore/sync-create-pr-cd-3954cc0
